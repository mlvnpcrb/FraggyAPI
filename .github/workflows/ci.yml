name: Phase 1 checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+asyncpg://fraggy:fraggy_local_only@127.0.0.1:5432/fraggy
      RUN_DB_TESTS: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/setup.sh
      - run: docker compose up -d --wait
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - name: Check migrations
        run: |
          .venv/bin/alembic -c apps/api/alembic.ini upgrade head
          .venv/bin/alembic -c apps/api/alembic.ini current
          .venv/bin/alembic -c apps/api/alembic.ini check
      - name: Runtime smoke and database outage recovery
        run: .venv/bin/python scripts/smoke.py --manage-services --check-db-outage
      - name: Secret patterns
        run: .venv/bin/python scripts/check_secrets.py
