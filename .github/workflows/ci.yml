name: Foundation checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, feat/phase-2e-catalog-data]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+asyncpg://fraggy:fraggy_local_only@127.0.0.1:5432/fraggy
      RUN_DB_TESTS: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: bash scripts/setup.sh
      - run: docker compose up -d --wait
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - name: Backend and frontend tests
        id: tests
        env:
          PYTEST_ADDOPTS: "--junitxml=${{ github.workspace }}/test-results/backend.xml"
        run: pnpm test
      - name: Backend failure diagnostics
        if: failure() && steps.tests.outcome == 'failure'
        run: .venv/bin/python scripts/report_test_failures.py test-results/backend.xml
      - run: pnpm build
      - name: Check migrations
        run: |
          .venv/bin/alembic -c apps/api/alembic.ini upgrade head
          .venv/bin/alembic -c apps/api/alembic.ini current
          .venv/bin/alembic -c apps/api/alembic.ini check
      - name: Runtime smoke and database outage recovery
        run: .venv/bin/python scripts/smoke.py --manage-services --check-db-outage --demo-catalog
      - name: Secret patterns
        run: .venv/bin/python scripts/check_secrets.py
