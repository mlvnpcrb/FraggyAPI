name: Foundation checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      [
        main,
        feat/phase-2h-pilot-readiness,
        feat/vercel-synthetic-demo,
        feat/phase-2j-real-data-readiness,
        feat/phase-2k-multisource-offline,
      ]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+asyncpg://fraggy:fraggy_local_only@127.0.0.1:5432/fraggy
      RUN_DB_TESTS: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: bash scripts/setup.sh
      - run: docker compose up -d --wait
      - run: pnpm lint
      - run: .venv/bin/ruff format --check apps/api scripts workers
      - run: pnpm typecheck
      - run: pnpm format:check
      - name: Disabled offline pilot proposal
        run: .venv/bin/python scripts/check_pilot_readiness.py config/wikidata-pilot-proposal.json
      - name: Phase 2J offline pilot rehearsal
        run: .venv/bin/python scripts/prepare_real_pilot.py --dry-run
      - name: Multi-source offline rehearsal
        run: pnpm catalog:rehearse
      - name: Backend and frontend tests
        id: tests
        env:
          PYTEST_ADDOPTS: "--junitxml=${{ github.workspace }}/test-results/backend.xml"
        run: pnpm test
      - name: Backend failure diagnostics
        if: failure() && steps.tests.outcome == 'failure'
        run: .venv/bin/python scripts/report_test_failures.py test-results/backend.xml
      - run: pnpm build
      - name: Check migrations
        run: |
          .venv/bin/alembic -c apps/api/alembic.ini upgrade head
          .venv/bin/alembic -c apps/api/alembic.ini current
          .venv/bin/alembic -c apps/api/alembic.ini check
      - name: Synthetic scheduled collection demonstration
        run: .venv/bin/python scripts/demo_collection.py
      - name: Original fictional Wikidata-format and media demonstration
        run: .venv/bin/python scripts/demo_collection.py --first-source --records 100
      - name: Original preview API and media benchmark smoke
        run: .venv/bin/python scripts/benchmark_preview.py --repeats 2 --warmup 1 --output data/reports/ci-preview-performance.json
      - name: Runtime smoke and database outage recovery
        run: .venv/bin/python scripts/smoke.py --manage-services --check-db-outage --demo-catalog
      - name: Secret patterns
        run: .venv/bin/python scripts/check_secrets.py

  vercel-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Frozen monorepo install without Python or database setup
        run: pnpm install --frozen-lockfile
      - name: Self-contained Vercel demo build
        run: pnpm --filter @fraggy/web build
        env:
          FRAGGY_DEMO_MODE: synthetic
          API_BASE_URL: http://127.0.0.1:1/unreachable
      - name: Self-contained production demo smoke
        run: node scripts/check_vercel_demo.mjs
