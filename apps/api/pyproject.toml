[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "fraggy-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.143,<0.144", "pydantic>=2,<3", "pydantic-settings>=2,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1", "asyncpg>=0.30,<1", "alembic>=1.16,<2",
  "uvicorn>=0.35,<1", "Pillow==13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx2>=2.13,<3", "ruff==0.17.1", "mypy>=1.17,<2"]

[tool.setuptools.packages.find]
include = ["fraggy_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
